<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>ZOCO — Admin Console</title>
<style>
  :root { --green: #16a34a; --red: #dc2626; --amber: #d97706; --gray: #6b7280; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f9fafb; color: #111827; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--gray); font-size: 13px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=password], input[type=text], textarea, select { padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; }
  textarea.code { width: 100%; font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.5; }
  button { padding: 8px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; background: #e5e7eb; }
  button.primary { background: var(--green); color: #fff; }
  button.danger { background: #fee2e2; color: var(--red); }
  button.approve { background: #dcfce7; color: #15803d; }
  button.small { padding: 4px 10px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: default; }
  .tabs { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
  .tabs button.active { background: #111827; color: #fff; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.needs_review { background: #fef3c7; color: var(--amber); }
  .badge.approved, .badge.published, .badge.reviewer { background: #dcfce7; color: #15803d; }
  .badge.rejected, .badge.disabled { background: #fee2e2; color: var(--red); }
  .badge.admin { background: #e0e7ff; color: #4338ca; }
  .badge.base { background: #f3f4f6; color: var(--gray); }
  .meta { color: var(--gray); font-size: 12px; margin-top: 6px; }
  .detail { margin: 8px 0; font-size: 14px; white-space: pre-wrap; }
  .err { color: var(--red); font-size: 13px; margin-top: 8px; white-space: pre-wrap; }
  .ok-box { background: #dcfce7; border: 1px solid #86efac; border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-size: 13px; word-break: break-all; }
  .empty { color: var(--gray); text-align: center; padding: 32px 0; font-size: 14px; }
  .note-box { margin-top: 10px; display: none; }
  .note-box.open { display: block; }
  td, th { font-size: 12px; text-align: left; padding: 5px 8px; vertical-align: top; }
  tr:nth-child(even) td { background: #f9fafb; }
  .who { margin-left: auto; font-size: 12px; color: var(--gray); }
</style>
</head>
<body>
<div class="wrap">
  <h1>ZOCO — Admin Console</h1>
  <p class="sub">Corrections review, reference database and user management. Reference publishes go live to the app within minutes; every action is recorded in the audit log.</p>

  <div class="card" id="login-card">
    <div class="row">
      <input type="password" id="token" placeholder="Your access token" style="flex:1" />
      <button class="primary" id="login-btn">Unlock</button>
    </div>
    <div class="err" id="login-err"></div>
  </div>

  <div id="console" style="display:none">
    <div class="tabs" id="tabs">
      <button data-view="queue" class="active">Queue</button>
      <button data-view="archive">Reviewed</button>
      <button data-view="audit">Audit log</button>
      <button data-view="ingredients" data-admin="1">Ingredients</button>
      <button data-view="users" data-admin="1">Users</button>
      <button data-view="membership" data-admin="1">Membership</button>
      <span class="who" id="who"></span>
      <button id="refresh" class="small">↻</button>
      <button id="logout" class="small">Lock</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<!-- Console logic lives in an external file (not inline) so the site CSP can
     exclude 'unsafe-inline' from script-src — an injected <script> in any
     rendered string can then never execute and steal the admin token. -->
<script src="/admin.js" defer></script>
</body>
</html>
