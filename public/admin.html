<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>NutriScan — Corrections Review</title>
<style>
  :root { --green: #16a34a; --red: #dc2626; --amber: #d97706; --gray: #6b7280; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f9fafb; color: #111827; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--gray); font-size: 13px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=password], textarea { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; }
  button { padding: 8px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; background: #e5e7eb; }
  button.primary { background: var(--green); color: #fff; }
  button.danger { background: #fee2e2; color: var(--red); }
  button.approve { background: #dcfce7; color: #15803d; }
  button:disabled { opacity: .5; cursor: default; }
  .tabs { display: flex; gap: 8px; margin: 16px 0; }
  .tabs button.active { background: #111827; color: #fff; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.needs_review { background: #fef3c7; color: var(--amber); }
  .badge.approved { background: #dcfce7; color: #15803d; }
  .badge.rejected { background: #fee2e2; color: var(--red); }
  .meta { color: var(--gray); font-size: 12px; margin-top: 6px; }
  .detail { margin: 8px 0; font-size: 14px; white-space: pre-wrap; }
  .err { color: var(--red); font-size: 13px; margin-top: 8px; }
  .empty { color: var(--gray); text-align: center; padding: 32px 0; font-size: 14px; }
  .note-box { margin-top: 10px; display: none; }
  .note-box.open { display: block; }
  td, th { font-size: 12px; text-align: left; padding: 4px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>NutriScan — Corrections Review</h1>
  <p class="sub">User-reported data corrections. Approving records a decision + audit entry — reference-data changes still ship as a reviewed config release, never automatically.</p>

  <div class="card" id="login-card">
    <div class="row">
      <input type="password" id="token" placeholder="Admin token" style="flex:1" />
      <button class="primary" id="login-btn">Unlock</button>
    </div>
    <div class="err" id="login-err"></div>
  </div>

  <div id="console" style="display:none">
    <div class="tabs">
      <button data-view="queue" class="active">Queue</button>
      <button data-view="archive">Reviewed</button>
      <button data-view="audit">Audit log</button>
      <button id="refresh" style="margin-left:auto">↻ Refresh</button>
      <button id="logout">Lock</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
(function () {
  var API = '/api/admin/corrections'
  var view = 'queue'
  var token = sessionStorage.getItem('nutriscan_admin_token') || ''

  var $ = function (id) { return document.getElementById(id) }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    })
  }

  function headers() {
    return { 'authorization': 'Bearer ' + token, 'content-type': 'application/json' }
  }

  function setLocked(locked, err) {
    $('login-card').style.display = locked ? '' : 'none'
    $('console').style.display = locked ? 'none' : ''
    $('login-err').textContent = err || ''
    if (locked) { token = ''; sessionStorage.removeItem('nutriscan_admin_token') }
  }

  async function load() {
    var res
    try {
      res = await fetch(API + '?view=' + view, { headers: headers() })
    } catch (e) {
      $('list').innerHTML = '<div class="empty">Network error — is the app deployed? (This API is not available in vite dev.)</div>'
      return
    }
    if (res.status === 401) return setLocked(true, 'Invalid token.')
    var body = await res.json().catch(function () { return {} })
    if (!res.ok) {
      $('list').innerHTML = '<div class="empty">' + esc(body.error || ('Error ' + res.status)) + '</div>'
      return
    }
    sessionStorage.setItem('nutriscan_admin_token', token)
    render(body.items || [])
  }

  function render(items) {
    if (!items.length) {
      $('list').innerHTML = '<div class="empty">Nothing in ' + esc(view) + '.</div>'
      return
    }
    if (view === 'audit') {
      $('list').innerHTML = '<div class="card"><table style="width:100%"><tr><th>When</th><th>Reviewer</th><th>Action</th><th>Correction</th><th>Barcode</th><th>Override</th><th>Note</th></tr>' +
        items.map(function (a) {
          return '<tr><td>' + esc((a.ts || '').replace('T', ' ').slice(0, 16)) + '</td><td>' + esc(a.reviewer || '') + '</td><td>' + esc(a.action) +
            '</td><td>' + esc(a.correctionId) + '</td><td>' + esc(a.barcode) +
            '</td><td>' + (a.override ? esc(a.override.field + ' = ' + a.override.value) : '—') + '</td><td>' + esc(a.note) + '</td></tr>'
        }).join('') + '</table></div>'
      return
    }
    $('list').innerHTML = items.map(function (r) {
      var actions = view === 'queue'
        ? '<div class="row" style="margin-top:10px">' +
            '<button class="approve" data-act="approve" data-id="' + esc(r.id) + '">Approve</button>' +
            '<button class="danger" data-act="reject" data-id="' + esc(r.id) + '">Reject</button>' +
          '</div>' +
          '<div class="note-box" id="note-' + esc(r.id) + '">' +
            '<textarea rows="2" placeholder="Review note (what did you verify?)"></textarea>' +
            '<div class="override-box" style="margin-top:8px">' +
              '<div class="meta" style="margin:0 0 4px">Optional: apply a data override (approve only). Nutrients are per 100 g in OFF units — sodium/salt in grams.</div>' +
              '<div class="row">' +
                '<select class="ov-field" style="padding:8px;border:1px solid #d1d5db;border-radius:8px;font-size:13px">' +
                  '<option value="">No data override</option>' +
                  '<option value="energy-kcal_100g">Energy (kcal/100g)</option>' +
                  '<option value="fat_100g">Total fat (g/100g)</option>' +
                  '<option value="saturated-fat_100g">Saturated fat (g/100g)</option>' +
                  '<option value="trans-fat_100g">Trans fat (g/100g)</option>' +
                  '<option value="carbohydrates_100g">Carbohydrates (g/100g)</option>' +
                  '<option value="sugars_100g">Sugars (g/100g)</option>' +
                  '<option value="fiber_100g">Fibre (g/100g)</option>' +
                  '<option value="proteins_100g">Protein (g/100g)</option>' +
                  '<option value="sodium_100g">Sodium (g/100g)</option>' +
                  '<option value="salt_100g">Salt (g/100g)</option>' +
                  '<option value="product_name">Product name</option>' +
                  '<option value="serving_size">Serving size</option>' +
                  '<option value="quantity">Pack quantity</option>' +
                '</select>' +
                '<input class="ov-value" placeholder="Corrected value" style="flex:1;padding:8px;border:1px solid #d1d5db;border-radius:8px;font-size:13px" />' +
              '</div>' +
            '</div>' +
            '<div class="row" style="margin-top:6px"><button class="primary" data-confirm="1" data-id="' + esc(r.id) + '">Confirm</button>' +
            '<button data-cancel="1" data-id="' + esc(r.id) + '">Cancel</button></div>' +
          '</div>'
        : ((r.reviewNote ? '<div class="meta">Note: ' + esc(r.reviewNote) + '</div>' : '') +
           (r.reviewedBy ? '<div class="meta">Reviewer: ' + esc(r.reviewedBy) + '</div>' : '') +
           (r.override ? '<div class="meta">Override applied: ' + esc(r.override.field) + ' = ' + esc(r.override.value) + '</div>' : ''))
      return '<div class="card">' +
        '<div class="row"><span class="badge ' + esc(r.status) + '">' + esc(r.status) + '</span>' +
        '<strong style="font-size:14px">' + esc(r.type) + '</strong>' +
        (r.barcode ? '<span class="meta" style="margin-top:0">#' + esc(r.barcode) + '</span>' : '') + '</div>' +
        (r.productName ? '<div class="meta">' + esc(r.productName) + (r.field ? ' — field: ' + esc(r.field) : '') + '</div>' : '') +
        '<div class="detail">' + esc(r.detail) + '</div>' +
        (r.sourceUrl ? '<div class="meta">Source: ' + esc(r.sourceUrl) + '</div>' : '') +
        '<div class="meta">Submitted ' + esc((r.ts || '').replace('T', ' ').slice(0, 16)) +
        (r.reviewedAt ? ' · reviewed ' + esc(r.reviewedAt.replace('T', ' ').slice(0, 16)) : '') + '</div>' +
        actions + '</div>'
    }).join('')
  }

  var pendingAction = null
  $('list').addEventListener('click', async function (e) {
    var b = e.target.closest('button')
    if (!b) return
    var id = b.getAttribute('data-id')
    if (b.hasAttribute('data-act')) {
      pendingAction = b.getAttribute('data-act')
      document.querySelectorAll('.note-box.open').forEach(function (n) { n.classList.remove('open') })
      var box = $('note-' + id)
      box.classList.add('open')
      // Overrides only make sense on approve.
      box.querySelector('.override-box').style.display = pendingAction === 'approve' ? '' : 'none'
    } else if (b.hasAttribute('data-cancel')) {
      $('note-' + id).classList.remove('open')
    } else if (b.hasAttribute('data-confirm')) {
      b.disabled = true
      var noteBox = $('note-' + id)
      var payload = { id: id, action: pendingAction, note: noteBox.querySelector('textarea').value }
      if (pendingAction === 'approve') {
        var field = noteBox.querySelector('.ov-field').value
        var value = noteBox.querySelector('.ov-value').value.trim()
        if (field && value) payload.override = { field: field, value: value }
      }
      var res = await fetch(API, {
        method: 'POST', headers: headers(),
        body: JSON.stringify(payload),
      }).catch(function () { return null })
      if (!res || !res.ok) {
        b.disabled = false
        alert('Failed: ' + (res ? (await res.json().catch(function () { return {} })).error || res.status : 'network error'))
        return
      }
      load()
    }
  })

  document.querySelectorAll('.tabs button[data-view]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tabs button[data-view]').forEach(function (x) { x.classList.remove('active') })
      b.classList.add('active')
      view = b.getAttribute('data-view')
      load()
    })
  })
  $('refresh').addEventListener('click', load)
  $('logout').addEventListener('click', function () { setLocked(true) })
  $('login-btn').addEventListener('click', function () {
    token = $('token').value.trim()
    if (!token) return
    setLocked(false)
    load()
  })
  $('token').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('login-btn').click() })

  if (token) { setLocked(false); load() }
})()
</script>
</body>
</html>
